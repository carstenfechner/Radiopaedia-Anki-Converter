<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anki Deck Builder — United Radiology</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inria+Sans:ital,wght@0,300;0,400;0,700;1,300;1,400;1,700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:       #1a1a1a;
      --surface:  #282828;
      --surface2: #363636;
      --border:   rgba(242,242,242,0.08);
      --border-s: #3a3a3a;
      --primary:  #c8392b;
      --fg:       #f2f2f2;
      --muted:    #8a8a8e;
      --success:  #30d158;
      --error:    #ff453a;
      --r:        12px;
      --r-sm:     8px;
      --font:     -apple-system, BlinkMacSystemFont, "Inria Sans", ui-sans-serif, system-ui, sans-serif;
    }

    html, body {
      height: 100%;
    }
    body {
      font-family: var(--font);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* ─── TopBar ─── */
    .topbar {
      height: 44px;
      flex-shrink: 0;
      border-bottom: 1px solid var(--border);
      background: rgba(26,26,26,0.88);
      backdrop-filter: saturate(1.8) blur(20px);
      -webkit-backdrop-filter: saturate(1.8) blur(20px);
      position: sticky;
      top: 0;
      z-index: 100;
    }
    .topbar-inner {
      display: flex;
      align-items: center;
      gap: 2px;
      height: 100%;
      max-width: 1280px;
      margin: 0 auto;
      padding: 0 16px;
    }
    .topbar-logo {
      display: flex;
      align-items: center;
      gap: 7px;
      text-decoration: none;
      flex-shrink: 0;
      padding: 0 4px;
    }
    .topbar-brand {
      font-size: 13px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.01em;
      opacity: 0.9;
    }
    .topbar-divider {
      width: 1px;
      height: 16px;
      background: rgba(242,242,242,0.14);
      margin: 0 8px;
      flex-shrink: 0;
    }
    .topbar-nav {
      display: flex;
      align-items: center;
      gap: 2px;
    }
    .nav-link {
      display: inline-flex;
      align-items: center;
      padding: 5px 12px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      text-decoration: none;
      transition: background 0.12s, color 0.12s;
    }
    .nav-link:hover  { color: var(--fg); background: rgba(242,242,242,0.06); }
    .nav-link.active { color: var(--fg); background: rgba(242,242,242,0.09); }
    .topbar-spacer { flex: 1; }

    /* ─── Page ─── */
    .page {
      flex: 1;
      max-width: 880px;
      width: 100%;
      margin: 0 auto;
      padding: 44px 20px 72px;
    }

    /* ─── Page header ─── */
    .page-header { margin-bottom: 24px; }
    .page-header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--fg);
      letter-spacing: -0.025em;
      line-height: 1.2;
    }
    .page-header p {
      margin-top: 5px;
      font-size: 0.875rem;
      color: var(--muted);
      line-height: 1.5;
    }
    code {
      font-family: ui-monospace, "SF Mono", monospace;
      font-size: 0.85em;
      background: rgba(242,242,242,0.08);
      padding: 1px 5px;
      border-radius: 4px;
    }

    /* ─── Card ─── */
    .card {
      background: var(--surface);
      border-radius: var(--r);
      box-shadow: 0 0 0 1px rgba(242,242,242,0.07);
      padding: 24px;
    }

    /* ─── Field label ─── */
    .fl {
      display: block;
      font-size: 0.8rem;
      font-weight: 500;
      color: var(--muted);
      margin-bottom: 6px;
    }

    /* ─── Text inputs ─── */
    input[type="text"], textarea {
      width: 100%;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: var(--r-sm);
      color: var(--fg);
      font-family: var(--font);
      font-size: 0.875rem;
      padding: 8px 11px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      resize: vertical;
    }
    input[type="text"]:focus, textarea:focus {
      border-color: rgba(200,57,43,0.45);
      box-shadow: 0 0 0 3px rgba(200,57,43,0.14);
    }
    input[type="text"] { height: 36px; resize: none; }
    textarea           { height: 140px; }
    ::placeholder      { color: rgba(242,242,242,0.18); }

    /* ─── Number inputs ─── */
    input[type="number"] {
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border);
      border-radius: 7px;
      color: var(--fg);
      font-family: var(--font);
      font-size: 0.875rem;
      text-align: center;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
      -moz-appearance: textfield;
    }
    input[type="number"]:focus {
      border-color: rgba(200,57,43,0.45);
      box-shadow: 0 0 0 3px rgba(200,57,43,0.14);
    }
    input[type="number"]::-webkit-inner-spin-button,
    input[type="number"]::-webkit-outer-spin-button { -webkit-appearance: none; }

    /* ─── URL panels (2-col grid) ─── */
    .url-panels {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 18px;
      margin-top: 18px;
    }
    @media (max-width: 600px) { .url-panels { grid-template-columns: 1fr; } }

    .panel-header {
      display: flex;
      align-items: center;
      gap: 7px;
      margin-bottom: 6px;
    }
    .panel-header .fl { margin: 0; }

    .badge {
      font-size: 0.68rem;
      font-weight: 500;
      padding: 2px 7px;
      border-radius: 10px;
      background: rgba(242,242,242,0.07);
      color: var(--muted);
      letter-spacing: 0.1px;
    }

    /* ─── Field row (inline label + number + hint) ─── */
    .field-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }
    .field-row .fl { margin: 0; white-space: nowrap; }
    .field-row input[type="number"] { width: 60px; height: 30px; padding: 0 8px; }
    .hint { font-size: 0.75rem; color: var(--muted); }

    /* ─── Checkbox row ─── */
    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .checkbox-row input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 15px; height: 15px;
      flex-shrink: 0;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--border-s);
      border-radius: 4px;
      cursor: pointer;
      position: relative;
      transition: background 0.12s, border-color 0.12s;
    }
    .checkbox-row input[type="checkbox"]:checked {
      background: var(--primary);
      border-color: var(--primary);
    }
    .checkbox-row input[type="checkbox"]:checked::after {
      content: "";
      position: absolute;
      left: 3px; top: 0px;
      width: 5px; height: 9px;
      border: 2px solid #fff;
      border-top: none; border-left: none;
      transform: rotate(45deg);
    }
    .cb-label {
      font-size: 0.8rem;
      color: var(--muted);
      cursor: pointer;
    }
    .quiz-limit {
      display: none;
      align-items: center;
      gap: 6px;
    }
    .quiz-limit.visible { display: flex; }
    .quiz-limit input[type="number"] { width: 50px; height: 26px; padding: 0 6px; border-radius: 6px; }

    /* ─── Primary submit button ─── */
    .btn-primary {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      width: 100%;
      height: 38px;
      margin-top: 20px;
      background: var(--primary);
      color: #fff;
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      transition: background 0.15s, opacity 0.15s, transform 0.1s;
      -webkit-font-smoothing: antialiased;
    }
    .btn-primary:hover    { background: #d4443c; }
    .btn-primary:active   { transform: translateY(1px); }
    .btn-primary:disabled { opacity: 0.38; cursor: not-allowed; transform: none; }

    /* ─── Progress ─── */
    #progress-section { display: none; margin-top: 22px; }
    .sep { border: none; border-top: 1px solid var(--border); margin-bottom: 18px; }

    .progress-bar-wrap {
      height: 2px;
      background: rgba(242,242,242,0.07);
      border-radius: 1px;
      overflow: hidden;
      margin-bottom: 12px;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      border-radius: 1px;
      width: 0%;
      transition: width 0.4s ease;
    }

    #progress-log {
      max-height: 220px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 3px;
    }
    .log-line {
      font-size: 0.8rem;
      line-height: 1.4;
      padding: 5px 10px;
      border-radius: 6px;
      color: var(--muted);
      word-break: break-all;
    }
    .log-line.active { color: var(--fg); background: rgba(242,242,242,0.03); }
    .log-line.done   { color: var(--success); }
    .log-line.error  { color: var(--error);   background: rgba(255,69,58,0.05); }

    /* ─── Download ─── */
    #download-section { display: none; margin-top: 14px; }
    .btn-download {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      width: 100%;
      height: 42px;
      background: rgba(242,242,242,0.05);
      color: var(--fg);
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 500;
      border: 1px solid rgba(242,242,242,0.11);
      border-radius: 10px;
      text-decoration: none;
      transition: background 0.15s;
    }
    .btn-download:hover { background: rgba(242,242,242,0.09); }

    /* ─── Footer ─── */
    .site-footer {
      border-top: 1px solid var(--border);
      padding: 18px 20px;
      flex-shrink: 0;
    }
    .footer-inner {
      max-width: 1280px;
      margin: 0 auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
    }
    .footer-brand {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--fg);
      opacity: 0.55;
    }
    .footer-meta {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.75rem;
      color: var(--muted);
    }
    .footer-meta a { color: var(--muted); text-decoration: none; transition: color 0.12s; }
    .footer-meta a:hover { color: var(--fg); }
  </style>
</head>
<body>

  <!-- ── TopBar ── -->
  <nav class="topbar" aria-label="Main navigation">
    <div class="topbar-inner">
      <a href="#" class="topbar-logo">
        <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect width="16" height="16" rx="2.5" fill="#FF0000"/>
          <rect x="6.5" y="2" width="3" height="12" fill="white"/>
          <rect x="2" y="6.5" width="12" height="3" fill="white"/>
        </svg>
        <span class="topbar-brand">United Radiology</span>
      </a>
      <div class="topbar-divider" aria-hidden="true"></div>
      <nav class="topbar-nav">
        <a href="#" class="nav-link active">Anki Builder</a>
      </nav>
      <div class="topbar-spacer"></div>
    </div>
  </nav>

  <!-- ── Main ── -->
  <main class="page">
    <div class="page-header">
      <h1>Anki Deck Builder</h1>
      <p>Scrape Radiopaedia articles &amp; cases and export a ready-to-import <code>.apkg</code> flashcard deck.</p>
    </div>

    <div class="card">
      <form id="job-form" autocomplete="off">

        <!-- Deck title -->
        <label class="fl" for="folder_title">Deck folder title</label>
        <input type="text" id="folder_title" name="folder_title"
               placeholder="e.g. Neuroradiology" required>

        <!-- URL panels -->
        <div class="url-panels">
          <div>
            <div class="panel-header">
              <label class="fl" for="article_urls">Article URLs</label>
              <span class="badge">Articles</span>
            </div>
            <textarea id="article_urls" name="article_urls"
              placeholder="https://radiopaedia.org/articles/lamina-papyracea-dehiscence&#10;https://radiopaedia.org/articles/..."></textarea>
            <div class="field-row">
              <label class="fl" for="max_cases_per_article">Max cases per article</label>
              <input type="number" id="max_cases_per_article" name="max_cases_per_article"
                     value="4" min="0" step="1">
              <span class="hint">0 = unlimited</span>
            </div>
            <div class="checkbox-row">
              <input type="checkbox" id="cases_from_articles" name="cases_from_articles" value="1">
              <label class="cb-label" for="cases_from_articles">Also add article cases to Quiz deck</label>
              <div class="quiz-limit" id="quiz-limit-wrap">
                <span class="hint">— max</span>
                <input type="number" id="max_quiz_cases_per_article" name="max_quiz_cases_per_article"
                       value="4" min="0" step="1">
                <span class="hint">0 = all</span>
              </div>
            </div>
          </div>

          <div>
            <div class="panel-header">
              <label class="fl" for="case_urls">Case URLs</label>
              <span class="badge">Cases</span>
            </div>
            <textarea id="case_urls" name="case_urls"
              placeholder="https://radiopaedia.org/cases/creutzfeldt-jakob-disease&#10;https://radiopaedia.org/cases/..."></textarea>
          </div>
        </div>

        <button class="btn-primary" type="submit" id="submit-btn">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="5 3 19 12 5 21 5 3"/>
          </svg>
          Create Anki Deck
        </button>
      </form>

      <!-- Progress -->
      <div id="progress-section">
        <hr class="sep">
        <div class="progress-bar-wrap">
          <div class="progress-bar-fill" id="progress-bar"></div>
        </div>
        <div id="progress-log"></div>
      </div>

      <!-- Download -->
      <div id="download-section">
        <a id="download-link" class="btn-download" href="#" download>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
               stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
          <span id="download-label">Download deck.apkg</span>
        </a>
      </div>
    </div>
  </main>

  <!-- ── Footer ── -->
  <footer class="site-footer">
    <div class="footer-inner">
      <div class="footer-brand">
        <svg width="13" height="13" viewBox="0 0 16 16" fill="none" aria-hidden="true">
          <rect width="16" height="16" rx="2.5" fill="#FF0000"/>
          <rect x="6.5" y="2" width="3" height="12" fill="white"/>
          <rect x="2" y="6.5" width="12" height="3" fill="white"/>
        </svg>
        United Radiology
      </div>
      <div class="footer-meta">
        <a href="https://radiopaedia.org" target="_blank" rel="noopener">Radiopaedia.org</a>
        <span>·</span>
        <span>© 2025 United Radiology</span>
      </div>
    </div>
  </footer>

  <script>
  (() => {
    const quizCb    = document.getElementById('cases_from_articles');
    const quizLimit = document.getElementById('quiz-limit-wrap');
    quizCb.addEventListener('change', () => {
      quizLimit.classList.toggle('visible', quizCb.checked);
    });

    const form          = document.getElementById('job-form');
    const submitBtn     = document.getElementById('submit-btn');
    const progressSec   = document.getElementById('progress-section');
    const progressBar   = document.getElementById('progress-bar');
    const progressLog   = document.getElementById('progress-log');
    const downloadSec   = document.getElementById('download-section');
    const downloadLink  = document.getElementById('download-link');
    const downloadLabel = document.getElementById('download-label');

    let es = null;

    const ICON_PLAY = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 3 19 12 5 21 5 3"/></svg>';
    const ICON_DL   = '<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg>';

    function addLog(text, cls) {
      const el = document.createElement('div');
      el.className = 'log-line' + (cls ? ' ' + cls : '');
      el.textContent = text;
      progressLog.appendChild(el);
      progressLog.scrollTop = progressLog.scrollHeight;
      return el;
    }

    let activeLogLine = null;

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      if (es) { es.close(); es = null; }

      progressLog.innerHTML = '';
      downloadSec.style.display = 'none';
      progressSec.style.display = 'block';
      progressBar.style.width   = '0%';
      submitBtn.disabled = true;
      submitBtn.textContent = 'Working…';
      activeLogLine = addLog('Starting…', 'active');

      const body = new FormData(form);
      let res, data;
      try {
        res  = await fetch('/start', { method: 'POST', body });
        data = await res.json();
      } catch (err) {
        addLog('Network error: ' + err.message, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = ICON_PLAY + ' Create Anki Deck';
        return;
      }

      if (data.error) {
        if (activeLogLine) activeLogLine.remove();
        addLog('Error: ' + data.error, 'error');
        submitBtn.disabled = false;
        submitBtn.innerHTML = ICON_PLAY + ' Create Anki Deck';
        return;
      }

      es = new EventSource('/progress/' + data.job_id);

      es.onmessage = (event) => {
        const msg = JSON.parse(event.data);
        if (msg.type === 'heartbeat') return;

        if (msg.type === 'progress') {
          if (activeLogLine) activeLogLine.textContent = msg.message;
          else activeLogLine = addLog(msg.message, 'active');
          if (msg.pct !== undefined) progressBar.style.width = msg.pct + '%';
          return;
        }

        if (msg.type === 'item_done') {
          if (activeLogLine) { activeLogLine.className = 'log-line done'; }
          activeLogLine = null;
          addLog('✓ ' + msg.message, 'done');
          return;
        }

        if (msg.type === 'done') {
          progressBar.style.width = '100%';
          if (activeLogLine) { activeLogLine.className = 'log-line done'; activeLogLine = null; }
          addLog('✓ Package built successfully!', 'done');
          downloadLink.href = msg.download_url;
          downloadLabel.textContent = 'Download ' + (msg.filename || 'deck.apkg');
          downloadSec.style.display = 'block';
          downloadLink.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
          submitBtn.disabled = false;
          submitBtn.innerHTML = ICON_PLAY + ' Create Another Deck';
          es.close();
          return;
        }

        if (msg.type === 'error') {
          if (activeLogLine) { activeLogLine.className = 'log-line error'; activeLogLine = null; }
          addLog('✗ ' + msg.message, 'error');
          submitBtn.disabled = false;
          submitBtn.innerHTML = ICON_PLAY + ' Try Again';
          es.close();
        }
      };

      es.onerror = () => {
        if (activeLogLine) { activeLogLine.className = 'log-line error'; }
        addLog('Connection lost.', 'error');
        es.close();
      };
    });
  })();
  </script>

</body>
</html>
